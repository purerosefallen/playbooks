---
  - hosts: init
    remote_user: nanahira
    gather_facts: false
    tasks:
      - name: authorized_key
        authorized_key:
          user: "{{ ansible_ssh_user }}"
          key: "{{ authorized_keys }}"
        when: authorized_keys
      - name: sudoers
        become: true
        copy:
          dest: '/etc/sudoers.d/mycard_sudoers_{{ ansible_ssh_user }}'
          content: '{{ ansible_ssh_user }} ALL=(ALL:ALL) NOPASSWD: ALL'
          owner: root
          group: root
          mode: 0700
        when: ansible_ssh_user != 'root'

---
  - hosts: init
    remote_user: nanahira
    gather_facts: false
    tasks:
      - name: sudoers
        become: true
        copy:
          dest: '/etc/sudoers.d/mycard_sudoers_{{ ansible_ssh_user }}'
          content: '{{ ansible_ssh_user }} ALL=(ALL:ALL) NOPASSWD: ALL'
          owner: root
          group: root
          mode: 0700
        when: ansible_ssh_user != 'root'
      - name: some apt packages
        become: true
        apt:
          name: python3-distro,gnupg2
          update_cache: true
        ignore_errors: true

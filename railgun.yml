---
  - hosts: init
    remote_user: root
    tasks:
      - name: railgun (curl only status)
        command:
          argv:
            - curl
            - -sS
            - -X
            - POST
            - -H
            - "Content-Type: application/json"
            - -d
            - "{{ railgun | to_json }}"
            - -o
            - /dev/null
            - -w
            - "%{http_code}"
            - https://m.lv5.ac/api/select
        register: railgun_result
        changed_when: false
        failed_when: railgun_result.rc != 0 or (railgun_result.stdout | int not in [200, 201])
        ignore_errors: true

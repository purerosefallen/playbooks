---
- hosts: worker
  remote_user: nanahira
  #roles:
  #  - init
  tasks:
    - name: ssh
      copy:
        src: ~/.ssh/id_rsa
        dest: ~/.ssh/
        mode: 0600
    - name: ssh
      copy:
        src: ~/.ssh/id_rsa.pub
        dest: ~/.ssh/
        mode: 0600
    - name: remove old ansible
      become: true
      apt:
        name: ansible,awscli
        autoremove: true
        purge: true
        state: absent
    - name: some apt packages
      become: true
      apt:
        update_cache: true
        name: ocserv,apache2-utils,python3-six
    - name: stop ocserv
      become: true
      service:
        name: ocserv
        state: stopped
        enabled: false
    - name: upgrade pip
      become: true
      pip:
        name: pip
        state: latest
    - name: install pip packages
      become: true
      pip:
        name: ansible<2.11.0,jinja2==3.0.0 
        state: latest
    - name: set ansible module_utils path
      set_fact:
        module_util_path: '/usr/local/lib/python{{ ansible_python.version.major }}.{{ ansible_python.version.minor }}/dist-packages/ansible/module_utils'
    - name: remove deprecated six
      become: true
      file:
        path: '{{module_util_path}}/six'
        state: absent
    - name: copy six.py
      become: true
      copy:
        src: /usr/lib/python3/dist-packages/six.py
        dest: '{{module_util_path}}/six.py'
    - name: copy urls.py
      become: true
      copy:
        src: ./files/urls.py
        dest: '{{module_util_path}}/urls.py'
    - name: ansible
      become: true
      synchronize:
        src: ~/ansible/
        dest: '{{ansible_user_dir}}/ansible'
        delete: true
    - name: aws
      synchronize:
        src: ~/.aws/
        dest: ~/.aws
        delete: true
    - name: npm
      copy:
        src: ~/.npmrc
        dest: ~/.npmrc

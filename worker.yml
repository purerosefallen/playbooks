---
- hosts: worker
  remote_user: nanahira
  #roles:
  #  - init
  tasks:
    - name: ssh
      copy:
        src: ~/.ssh/id_rsa
        dest: ~/.ssh/
        mode: 0600
    - name: ssh
      copy:
        src: ~/.ssh/id_rsa.pub
        dest: ~/.ssh/
        mode: 0600
    - name: remove old ansible
      become: true
      apt:
        name: ansible,awscli
        autoremove: true
        purge: true
        state: absent
    - name: some apt packages
      become: true
      apt:
        update_cache: true
        name: ocserv,apache2-utils,python3-six
    - name: stop ocserv
      become: true
      service:
        name: ocserv
        state: stopped
        enabled: false
    - name: upgrade pip
      become: true
      pip:
        name: pip
        state: latest
    - name: install pip packages
      become: true
      pip:
        name: awscli
        state: latest
    - name: ansible
      become: true
      synchronize:
        src: ~/ansible/
        dest: '{{ansible_user_dir}}/ansible'
        delete: true
    - name: install ansible for python <= 3.11
      include_tasks: ./tasks/worker-python3.11.yml
      when: ansible_python.version.major == 3 and ansible_python.version.minor < 12
    - name: install ansible for python >= 3.12
      include_tasks: ./tasks/worker-python3.12.yml
      when: ansible_python.version.major == 3 and ansible_python.version.minor >= 12
    - name: aws
      synchronize:
        src: ~/.aws/
        dest: ~/.aws
        delete: true
    - name: npm
      copy:
        src: ~/.npmrc
        dest: ~/.npmrc

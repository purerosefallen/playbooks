---
  - hosts: '{{ services_target_hosts | default("services") }}'
    remote_user: root
    tasks:
      - name: directory
        file:
          path: '{{ ansible_user_dir }}/{{ service_path }}/{{ item }}'
          state: directory
          recurse: true
        with_items:
          - data
          - templates
          - collects
      - name: docker-compose file
        template:
          src: 'files/services/{{ service_name }}/docker-compose.yml.j2'
          dest: '{{ ansible_user_dir }}/{{ service_path }}/docker-compose.yml'
      - name: data
        become: true
        synchronize:
          src: 'files/services/{{ service_name }}/data/'
          dest: '{{ ansible_user_dir }}/{{ service_path }}/data'
          delete: yes
          copy_links: yes
          recursive: yes
          verify_host: no
          checksum: yes
          archive: no
          perms: yes
          rsync_opts: '{{ upload_rsync_opts | default([]) }}'
        notify: handle
      - name: specific files
        copy: '{{item}}'
        with_items: '{{ specific_files }}'
        notify: handle
      - name: template directories
        become: true
        with_community.general.filetree: 'files/services/{{ service_name }}/templates/'
        file:
          path: '{{ ansible_user_dir }}/{{ service_path }}/templates/{{ item.path }}'
          state: directory
          owner: '{{ ansible_user_id }}'
          group: '{{ ansible_user_id }}'
        when:
          - service_name != "frpc"
          - item.state == "directory"
      - name: templates
        become: true
        with_community.general.filetree: 'files/services/{{ service_name }}/templates/'
        template:
          src: '{{ item.src }}'
          dest: "{{ ansible_user_dir }}/{{ service_path }}/templates/{{ item.path | regex_replace('\\.j2$', '') }}"
          owner: '{{ ansible_user_id }}'
          group: '{{ ansible_user_id }}'
          follow: yes
        notify: handle
        when:
          - service_name != "frpc"
          - item.state == "file"
          - item.path is regex('.*\\.j2$')
      - name: templates for frpc
        become: true
        with_items: '{{ frpc_instances }}'
        template:
          src: 'files/services/{{ service_name }}/templates/frpc.ini.j2'
          dest: '{{ ansible_user_dir }}/{{ service_path }}/templates/frpc_{{ item.name }}.ini'
          owner: '{{ ansible_user_id }}'
          group: '{{ ansible_user_id }}'
          follow: yes
        when: service_name == "frpc"
        notify: handle
      - name: docker-compose up -d
        docker_compose:
          project_src: '{{ ansible_user_dir }}/{{ service_path }}'
          remove_orphans: true
          build: '{{build}}'
          pull: '{{pull}}'
    handlers:
      - name: handle
        include_tasks: 'handlers/docker.yaml'
        vars:
          handler: 
            type: docker
            path: '{{ ansible_user_dir }}/{{ service_path }}'
            services: '{{ handle_services }}'
        when: handle_services and handle_services | length > 0
